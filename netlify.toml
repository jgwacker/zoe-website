[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its 15 credits) when nothing the site is built from changed,
  # e.g. commits that only touch tests/, docs/, design/, scripts/ or README files.
  # Exit 0 = skip, 1 = build. Always build when there's no previous deploy to compare with,
  # or when it's the same commit (a manual "retry deploy").
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- src public data astro.config.mjs package.json package-lock.json tsconfig.json netlify.toml'
